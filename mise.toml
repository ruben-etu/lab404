[tools]
helm = "4.2.2"
kind = "0.32.0"
kubectl = "1.35.0"
kubeseal = "0.39.1"
kustomize = "5.8.1"
uv = "0.11.7"

[tasks.check-tools]
description = "Check required host tools"
run = '''
for tool in git docker kind kubectl helm kustomize; do
  command -v "$tool" >/dev/null || { echo "missing: $tool"; exit 1; }
done
echo "Required tools are available."
'''

[tasks.test-go]
description = "Run votes tests"
run = "mise -C apps/votes run test"

[tasks.test-web]
description = "Run web tests"
dir = "apps/web"
run = ".venv/bin/python -m unittest -v"

[tasks.update-web-dependencies]
description = "Update the web dependency lock with hashes"
run = "uv pip compile apps/web/requirements.txt --python-version 3.14 --generate-hashes --upgrade --output-file apps/web/requirements.lock"

[tasks.test]
description = "Run all application tests"
depends = ["test-go", "test-web"]

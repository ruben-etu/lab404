apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespaces.yaml

patches:
  # Avoid the shared host root user's exhausted inotify quota.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: metallb-frr-k8s-statuscleaner
      namespace: metallb-system
    patch: |-
      - op: add
        path: /spec/template/spec/securityContext
        value:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532

helmGlobals:
  chartHome: .cache/charts

helmCharts:
  - name: metallb
    repo: https://metallb.github.io/metallb
    version: 0.16.1
    releaseName: metallb
    namespace: metallb-system
    includeCRDs: true
  - name: gateway-helm
    repo: oci://docker.io/envoyproxy
    version: v1.8.3
    releaseName: envoy-gateway
    namespace: envoy-gateway-system
    includeCRDs: true
  - name: opentelemetry-collector
    repo: https://open-telemetry.github.io/opentelemetry-helm-charts
    version: 0.165.0
    releaseName: otel-collector
    namespace: observability
    valuesFile: opentelemetry-values.yaml
  - name: kyverno
    repo: https://kyverno.github.io/kyverno
    version: 3.9.2
    releaseName: kyverno
    namespace: kyverno
    includeCRDs: true
    skipTests: true
    valuesFile: kyverno-values.yaml
  - name: sealed-secrets
    repo: https://bitnami.github.io/sealed-secrets
    version: 2.19.3
    releaseName: sealed-secrets
    namespace: sealed-secrets
    includeCRDs: true
    skipTests: true
    valuesFile: sealed-secrets-values.yaml
  - name: falco
    repo: https://falcosecurity.github.io/charts
    version: 9.1.0
    releaseName: falco
    namespace: falco
    skipTests: true
    valuesFile: falco-values.yaml

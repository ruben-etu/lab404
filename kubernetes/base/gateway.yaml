apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: lab404
spec:
  gatewayClassName: lab404
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
spec:
  parentRefs:
    - name: lab404
  rules:
    - backendRefs:
        - name: web
          port: 8080

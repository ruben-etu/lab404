apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-application-signatures
spec:
  failurePolicy: Fail
  validationActions:
    - Deny
  webhookConfiguration:
    timeoutSeconds: 15
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: lab404
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods, pods/ephemeralcontainers]
  matchImageReferences:
    - glob: ghcr.io/ruben-etu/lab404-web@*
    - glob: ghcr.io/ruben-etu/lab404-web:*
    - glob: ghcr.io/ruben-etu/lab404-votes@*
    - glob: ghcr.io/ruben-etu/lab404-votes:*
  validationConfigurations:
    mutateDigest: false
    required: true
    verifyDigest: true
  variables:
    - name: allImages
      expression: >-
        images.containers + images.?initContainers.orValue([])
        + images.?ephemeralContainers.orValue([])
  attestors:
    - name: githubActionsMain
      cosign:
        keyless:
          identities:
            - subject: https://github.com/ruben-etu/lab404/.github/workflows/images.yml@refs/heads/main
              issuer: https://token.actions.githubusercontent.com
        ctlog:
          url: https://rekor.sigstore.dev
  validations:
    - expression: >-
        variables.allImages.map(image, verifyImageSignatures(image, [attestors.githubActionsMain]))
        .all(result, result > 0)
      message: Application images must be signed by the trusted GitHub Actions workflow.
